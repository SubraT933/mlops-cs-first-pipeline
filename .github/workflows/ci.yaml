# GitHub Actions Workflow
# GitHub automatically looks for workflow files inside .github/workflows/

name: Iris ML API - CI Pipeline

# Define when GitHub should run this workflow
on:
  # Run CI whenever code is pushed to the main branch
  push:
    branches:
      - main
  
  # Also validate proposed changes before they are merged
  pull_request:
    branches:
      - main

# Permissions for GitHub Actions
permissions:
  contents: read
  packages: write

# Define the jobs that make up the pipeline
jobs:
  test:
    name: Run automated tests
    # GitHub provides a fresh Ubuntu VM for this job
    runs-on: ubuntu-latest

    steps:
      # Step-1: Download the repo content to the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Step-2: Install Python on runner
      - name: Install Python on Runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step-3: Install the dependencies needed to run the tests
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step-4: Execute the automated tests
      - name: Run automated tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v

  build:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      # Step-1: Download repo source code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step-2: Log in to GitHub Container Registry (only on push to main)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step-3: Ensure image name is lowercase (Docker requires lowercase repo names)
      - name: Set lowercase repository name
        run: |
          echo "IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Step-4: Build Docker image (runs on both pull request and push to main)
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t iris-ml-api:${{ github.sha }} .

      # Step-5: Publish image to GHCR (only on push to main)
      - name: Publish Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
